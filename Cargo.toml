[package]
name = "cachegirl"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Centralized management of temporary resources in Rust: files, buffers, caches, and scratch data with namespaces, quotas, leases, cleanup policies, and crash recovery"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/bejiihiu/cachegirl"
repository = "https://github.com/bejiihiu/cachegirl"
keywords = ["cache", "temporary", "tempfile", "cleanup", "resources"]
categories = ["caching", "filesystem", "memory-management", "concurrency", "os"]
readme = "README.md"
exclude = ["IDEA.md", "notes.md"]
autobenches = false

[features]
default = ["filesystem"]
filesystem = []
memory = []
cache = []
async = []
sync = []
serde = ["dep:serde"]
metrics = ["dep:metrics"]
tracing = ["dep:tracing"]
tokio = ["dep:tokio", "async"]

[dependencies]
thiserror = "2"
serde = { version = "1", optional = true, features = ["derive"] }
metrics = { version = "0.24", optional = true }
tracing = { version = "0.1", optional = true }
tokio = { version = "1", optional = true, default-features = false, features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }

[dev-dependencies]
# dev-only runtime so doctests and async integration tests can drive futures
# without pulling a runtime into the published crate graph
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread", "macros", "time"] }
# serde_json is dev-only; its transitive deps (itoa, ryu) are pure Rust and
# build fine on windows-gnu
serde_json = "1"
# windows-gnu has no dlltool, so no `ansi` feature (pulls nu-ansi-term → windows-sys);
# fmt works fine without colors, just monochrome output
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "fmt", "registry"] }
# windows-gnu has no dlltool, so proptest runs with default features off:
# `std` would pull rand/os_rng → getrandom, `fork` would pull tempfile and
# friends — all unbuildable here. ChaCha-based generation needs none of them.
# no fork means a panicking case aborts the runner instead of printing a
# shrinked report, which is fine (it never goes green silently).
proptest = { version = "1.11.0", default-features = false, features = ["alloc", "no_std", "regex-syntax"] }

[[example]]
name = "async_usage"
required-features = ["tokio"]

[[bench]]
name = "allocation"
harness = false

[[bench]]
name = "cleanup"
harness = false

[[bench]]
name = "concurrent"
harness = false

[[bench]]
name = "cache"
harness = false

[[bench]]
name = "registry"
harness = false

[[example]]
name = "tracing_usage"
required-features = ["tracing", "filesystem"]

[[example]]
name = "metrics_usage"
required-features = ["metrics", "filesystem"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
